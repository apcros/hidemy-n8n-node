name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # Not `npm ci`: npm 11 rewrites this toolchain's lockfile on every
        # install (optional deps of unrs-resolver flip between two states) and
        # then rejects it. `--no-save` keeps the checkout clean.
        run: 'npm install --no-save --no-audit --no-fund'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
